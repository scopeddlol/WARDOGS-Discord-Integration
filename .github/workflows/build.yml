name: Build installers and controller
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test standalone application
        run: python -m pytest -q
      - name: Prepare bundled OCR
        run: ./packaging/prepare-ocr.ps1
      - name: Build standalone installer
        run: ./packaging/build.ps1 -Python python
      - name: Check install, GUI, OCR, upgrade and uninstall
        run: ./packaging/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-installer
          path: |
            dist/WARDOGS-Discord-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-verification
          path: artifacts/
          if-no-files-found: ignore

  agent:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: multiuser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest checks/agent_checks.py -q
      - name: Prepare bundled OCR
        run: ./packaging/prepare-ocr.ps1
      - name: Build agent installer
        run: ./packaging/build.ps1 -Python python
      - name: Check install, GUI, OCR, upgrade and uninstall
        run: ./packaging/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-installer
          path: |
            multiuser/dist/WARDOGS-Agent-Setup.exe
            multiuser/dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-verification
          path: multiuser/artifacts/
          if-no-files-found: ignore

  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: multiuser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r controller/requirements.txt pytest==8.4.2
      - run: python -m pytest checks/controller_checks.py -q
      - name: Build and exercise the container
        env:
          TEST_ADMIN: ci-only-controller-key-0000000000000000
        run: |
          cp .env.example .env
          docker compose config --format json > /tmp/compose.json
          python -c "import json; c=json.load(open('/tmp/compose.json')); assert not c['services']['controller'].get('ports')"
          docker build -f controller/Dockerfile -t wardogs-controller:test .
          docker run -d --name wardogs-test --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 -v wardogs-test-data:/data -e DISCORD_DRY_RUN=1 -e CONTROLLER_ADMIN_TOKEN="$TEST_ADMIN" wardogs-controller:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break || sleep 1; done
          python checks/container_smoke.py --token "$TEST_ADMIN"
          docker restart wardogs-test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break || sleep 1; done
          python -c "import os,httpx; r=httpx.get('http://127.0.0.1:18080/api/admin/state',headers={'Authorization':'Bearer '+os.environ['TEST_ADMIN']}); r.raise_for_status(); s=r.json(); assert len(s['agents'])==10; assert s['layout']['image'].startswith('attachment://')"
      - name: Container logs
        if: always()
        run: docker logs wardogs-test || true

  publish-controller:
    if: github.event_name == 'push'
    needs: controller
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase GHCR namespace
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wardogs-controller" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./multiuser
          file: ./multiuser/controller/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [standalone, agent, publish-controller]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-installer
          path: release/standalone
      - uses: actions/download-artifact@v4
        with:
          name: agent-installer
          path: release/agent
      - name: Combine checksums
        run: cat release/standalone/SHA256SUMS.txt release/agent/SHA256SUMS.txt > release/SHA256SUMS.txt
      - name: Create draft release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/standalone/WARDOGS-Discord-Setup.exe release/agent/WARDOGS-Agent-Setup.exe release/SHA256SUMS.txt --draft --title "WARDOGS $RELEASE_TAG" --notes "Windows x64 installers for standalone and controller agent. The Docker controller is published as ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wardogs-controller:$RELEASE_TAG. Installers are unsigned."
