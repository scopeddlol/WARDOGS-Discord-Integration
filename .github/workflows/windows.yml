name: Windows installer
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run behavior and UI tests
        run: python -m pytest -q
      - name: Prepare bundled OCR runtime
        run: ./packaging/prepare-ocr.ps1
      - name: Build application and installer
        run: ./packaging/build.ps1 -Python python
      - name: Test install, GUI, OCR, upgrade, and uninstall
        run: ./packaging/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/WARDOGS-Discord-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: artifacts/
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --title "WARDOGS Discord $RELEASE_TAG" --notes "Windows x64 installer with bundled Python and OCR. Download WARDOGS-Discord-Setup.exe. Builds are unsigned. See the repository setup guide for Discord bot configuration."
